<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1086, height=1920" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1086px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: "Inter", system-ui, sans-serif;
      }

      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 138px;
      }

      .kicker {
        font-size: 29px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #ffcfe0;
        margin-bottom: 16px;
      }

      .panel {
        background: rgba(19, 14, 18, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 42px;
        padding: 50px 60px 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .title-1, .title-2 {
        font-size: 78px;
        font-weight: 900;
        line-height: 1.02;
        letter-spacing: -1.5px;
        color: #ffffff;
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.55);
      }
      .title-2 { color: #ffe9f1; }

      .underline {
        width: 132px;
        height: 7px;
        border-radius: 4px;
        background: #e84a7f;
        margin: 20px 0 30px;
        transform-origin: left center;
      }

      .pill {
        background: #e84a7f;
        color: #ffffff;
        font-size: 37px;
        font-weight: 800;
        letter-spacing: 1.5px;
        padding: 18px 40px;
        border-radius: 999px;
        box-shadow: 0 14px 34px rgba(232, 74, 127, 0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.6"
      data-width="1086"
      data-height="1920"
    >
      <div id="overlay" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
        <div class="panel">
          <div class="kicker">CE QUE JE TE PROPOSE</div>
          <div class="title-1">DIAGNOSTIC</div>
          <div class="title-2">PERSONNALISÉ</div>
          <div class="underline"></div>
          <div class="pill">ONGLES &middot; 100% OFFERT</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".kicker", { y: -28, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.from(".panel", { y: 56, scale: 0.92, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.from(".title-1", { y: 42, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.from(".title-2", { y: 42, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.66);
      tl.from(".underline", { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 0.92);
      tl.from(".pill", { scale: 0, opacity: 0, duration: 0.55, ease: "back.out(1.7)" }, 1.05);

      tl.to(".panel", { y: -26, opacity: 0, duration: 0.45, ease: "power2.in" }, 3.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
