<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1086, height=1920" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1086px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: "Inter", system-ui, sans-serif;
      }

      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 132px;
      }

      .panel {
        background: rgba(19, 14, 18, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 42px;
        padding: 46px 60px 54px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .kicker {
        font-size: 29px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #ffcfe0;
        margin-bottom: 14px;
      }

      .title-1 {
        font-size: 58px;
        font-weight: 900;
        letter-spacing: -1px;
        color: #ffffff;
        line-height: 1.05;
      }
      .title-2 {
        font-size: 122px;
        font-weight: 900;
        letter-spacing: -2px;
        line-height: 1;
        color: #ff7aa3;
        text-shadow: 0 6px 30px rgba(232, 74, 127, 0.5);
      }

      .underline {
        width: 150px;
        height: 7px;
        border-radius: 4px;
        background: #e84a7f;
        margin: 22px 0 30px;
        transform-origin: center;
      }

      .pill {
        display: flex;
        align-items: center;
        gap: 16px;
        background: #e84a7f;
        color: #ffffff;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 1.5px;
        padding: 20px 44px;
        border-radius: 999px;
        box-shadow: 0 14px 34px rgba(232, 74, 127, 0.55);
      }
      .pill .arrow { font-size: 40px; font-weight: 900; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.4"
      data-width="1086"
      data-height="1920"
    >
      <div id="overlay" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
        <div class="panel">
          <div class="kicker">ENVIE D'ESSAYER ?</div>
          <div class="title-1">TON DIAGNOSTIC EST</div>
          <div class="title-2">GRATUIT</div>
          <div class="underline"></div>
          <div class="pill"><span class="label">RÉSERVE LE TIEN</span><span class="arrow">&rarr;</span></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".panel", { y: 56, scale: 0.92, duration: 0.55, ease: "power3.out" }, 0.15);
      tl.from(".kicker", { y: -24, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.3);
      tl.from(".title-1", { y: 38, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.45);
      tl.from(".title-2", { scale: 0.6, opacity: 0, duration: 0.6, ease: "back.out(1.6)" }, 0.62);
      tl.from(".underline", { scaleX: 0, opacity: 0, duration: 0.45, ease: "power2.inOut" }, 0.95);
      tl.from(".pill", { y: 36, opacity: 0, duration: 0.5, ease: "expo.out" }, 1.1);
      tl.from(".pill .arrow", { x: -14, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.4);

      tl.to(".pill", { scale: 1.045, duration: 0.5, ease: "power1.inOut", yoyo: true, repeat: 3 }, 1.75);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
